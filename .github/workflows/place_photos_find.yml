name: 그해 그곳 사진 후보 모으기
# 서울연구원 경관기록사진을 통째로 훑어 data/place-photos.json 을 만든다. 손으로 돌린다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = 사이트 모양만 보기, build = 후보 표 만들기'
        required: true
        default: 'probe'
      collections:
        description: '컬렉션 번호 (예: 553 또는 540-600)'
        required: false
        default: '553'
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 긁기
        env:
          MODE: ${{ github.event.inputs.mode }}
          COLS: ${{ github.event.inputs.collections }}
        run: |
          if [ "$MODE" = "probe" ]; then
            python -u tools/place_photos_find.py --probe > /tmp/run.log 2>&1 || true
          else
            python -u tools/place_photos_find.py --collections "$COLS" > /tmp/run.log 2>&1 || true
          fi
          tail -200 /tmp/run.log
          cp /tmp/run.log tools/last-place-photos-find.log
      - name: 기록 올리기
        if: always()
        run: |
          git config user.name omaju-bot; git config user.email bot@omaju.kr
          git add data tools/last-place-photos-find.log 2>/dev/null || true
          git commit -qm "그해 그곳 사진 후보 [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done
