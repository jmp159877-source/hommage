# 오늘의 나들이: 17개 지역을 두 묶음으로 나눠 01:10·02:10 에 만든다 (시간이 오래 걸려 따로 돌림)
name: outing
on:
  schedule:
    - cron: '10 16 * * *'   # 01:10 KST  앞 묶음
    - cron: '10 17 * * *'   # 02:10 KST  뒤 묶음
  workflow_dispatch:
    inputs:
      date:
        description: '만들 날짜 (YYYY-MM-DD, 비우면 오늘)'
        required: false
      regions:
        description: '지역 (쉼표, 비우면 전체를 두 번 나눠 실행)'
        required: false
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q google-cloud-firestore
      - name: 나들이 만들기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          ARGS="${{ github.event.inputs.date }}"
          R="${{ github.event.inputs.regions }}"
          if [ -z "$R" ]; then
            H=$(date -u +%H)
            if [ "$H" = "16" ] || [ -z "${{ github.event.schedule }}" ]; then R="서울,경기,인천,부산,대구,광주,대전,울산,세종"; else R="강원,충북,충남,전북,전남,경북,경남,제주"; fi
          fi
          set +e
          timeout 50m python -u tools/gen_daily.py $ARGS --only=outing --regions=$R 2>&1 | tee /tmp/outing.log; rc=${PIPESTATUS[0]}
          mkdir -p daily; sed -E 's/key=[A-Za-z0-9_\-]+/key=[키]/g' /tmp/outing.log | tail -300 > daily/last-outing.log
          exit $rc
      - name: 기록
        if: always()
        run: |
          git config user.name "omaju-bot"; git config user.email "bot@omaju.kr"
          git pull -q --rebase origin main || true
          git add daily/ || true
          git diff --cached --quiet || (git commit -m "나들이 기록 [skip ci]" && git push)
