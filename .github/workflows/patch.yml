name: 하루 콘텐츠 손보기
on:
  workflow_dispatch:
    inputs:
      date: { description: '날짜 YYYY-MM-DD', required: true }
      patch: { description: '고칠 내용 JSON', required: true }
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install google-cloud-firestore
      - env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DATE: ${{ github.event.inputs.date }}
          PATCH: ${{ github.event.inputs.patch }}
        run: |
          python tools/patch_daily.py
          git config user.name "omaju-bot"; git config user.email "bot@omaju.kr"
          git add daily; git commit -m "하루 콘텐츠 손봄 $DATE" || true
          git pull --rebase origin main && git push
