name: 오프닝 목소리 견본
on:
  workflow_dispatch:
    inputs:
      only:
        description: '다시 만들 조각 (예: miso_5,hangyeol_1)'
        required: false
        default: ''
      whole:
        description: '1이면 대본 전체 한 번에'
        required: false
        default: ''
      audition:
        description: '1이면 목소리 오디션'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 목소리 만들기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ONLY: ${{ inputs.only }}
          AUDITION: ${{ inputs.audition }}
          WHOLE: ${{ inputs.whole }}
          PAUSE: '30'
        run: python3 tools/voice_sample.py
      - name: 견본 가지에 올리기
        if: always()
        run: |
          mkdir -p /tmp/v && cp -r out_voice/* /tmp/v/ || true
          git config user.name omaju-bot; git config user.email bot@omaju.kr
          git checkout --orphan voice-samples && git rm -rqf . && cp /tmp/v/* . 2>/dev/null; true && git add -A && git commit -qm "목소리 견본" && git push -f origin voice-samples
