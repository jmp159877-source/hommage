<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오마주 (Omaju) - 오늘도 마음은 주니어</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        
        :root {
            --ivory: #F4F1EA;
            --dark-green: #0F4A35;
            --bright-green: #19B46B;
            --black: #141414;
            --gray: #666;
        }

        body { margin: 0; background-color: var(--ivory); color: var(--black); font-family: 'Noto Sans KR', sans-serif; }
        h1, h2, h3, .serif-text { font-family: 'Nanum Myeongjo', serif; font-weight: 400; }
        
        .spot-wrap { display: inline-block; position: relative; }
        .spot-wrap::before {
            content: "●";
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--bright-green);
            font-size: 8px;
        }

        .layout-wrapper { display: flex; min-height: 100vh; }
        
        .left-hero { width: 45%; position: sticky; top: 0; height: 100vh; background: #ccc center/cover; display: flex; flex-direction: column; justify-content: space-between; padding: 60px; box-sizing: border-box; }
        .left-hero::after { content: ''; position: absolute; top:0; left:0; right:0; bottom:0; background: linear-gradient(to top, rgba(15, 74, 53, 0.85) 0%, rgba(0,0,0,0.3) 100%); }
        
        .hero-text { position: relative; z-index: 1; color: var(--ivory); }
        
        /* 보정: 거대한 투명 여백을 상쇄하고 어두운 배경에서 보이게 은은한 후광 적용 */
        .main-logo { 
            width: 150%; 
            max-width: 450px; 
            display: block; 
            margin-left: -25%; 
            margin-top: -60px; 
            margin-bottom: -40px; 
            filter: drop-shadow(0px 0px 20px rgba(244, 241, 234, 0.7)); 
        }
        
        .brand-explain { font-family: 'Nanum Myeongjo', serif; font-size: 1.8rem; margin: 0 0 20px 0; line-height: 1.4; color: #fff; font-weight: 300; }
        .hero-text p { font-size: 1.15rem; font-weight: 300; opacity: 0.9; line-height: 1.6; border-top: 1px dashed rgba(255,255,255,0.3); padding-top: 20px; }
        
        .right-content { width: 55%; padding: 100px 80px; box-sizing: border-box; background-color: var(--ivory); }
        .category-label { font-size: 1.4rem; color: var(--dark-green); border-bottom: 1px solid rgba(15, 74, 53, 0.2); padding-bottom: 15px; margin-bottom: 30px; margin-top: 70px; display: flex; align-items: center; }
        .category-label:first-child { margin-top: 0; }
        
        /* 보정: 우측 아이콘 투명 여백 상쇄 */
        .category-icon { 
            height: 100px; 
            margin: -35px 5px -35px -30px; 
            vertical-align: middle; 
        }
        
        .content-box { font-size: 1rem; line-height: 1.6; color: var(--gray); margin-bottom: 50px; }
    </style>
</head>
<body>
    <div id="main-page" class="layout-wrapper">
        <div class="left-hero" id="greeting-card" style="background-image: url('spring.jfif');">
            <div class="hero-text">
                <img src="logo.png" alt="오마주 로고" class="main-logo">
                <div class="brand-explain">
                    <span class="spot-wrap">오</span>늘도 
                    <span class="spot-wrap">마</span>음은 
                    <span class="spot-wrap">주</span>니어.
                </div>
            </div>
        </div>

        <div class="right-content">
            <div class="category-label serif-text">
                <img src="logo.png" class="category-icon" alt="로고"> 오늘의 날씨
            </div>
            <div class="content-box">
                날씨 정보가 표시될 영역입니다.
            </div>

            <div class="category-label serif-text">
                <img src="logo.png" class="category-icon" alt="로고"> 오늘의 인사말
            </div>
            <div class="content-box">
                시니어의 두 번째 청춘을 응원하는 따뜻한 인사말이 들어갈 영역입니다.
            </div>
        </div>
    </div>
</body>
</html>
